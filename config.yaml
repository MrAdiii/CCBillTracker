providers:
  # Credit Cards
  - name: HDFC
    type: Credit Card
    file_naming_pattern: "HDFC IndianOil CC Bill {month_year}"
    domains:
      - 'Emailstatements.cards@hdfcbank.bank.in'
      - 'EmailStatements.cards@hdfcbank.net'
    matching_keywords:
      - 'statement'
      - 'e-statement'
      - 'IndianOil'
    bill_identifier: "IndianOil CC"
    extraction_rules:
      amount_due:
        - '(?i)total\s+amount\s+due[\s\S]{0,100}?(?:rs\.?|inr|₹)\s*(-?[\d,\.]+(?:\s*(?:cr|dr))?)'
        - '(?i)total\s+amount[\s\S]{0,100}?(?:rs\.?|inr|₹)\s*(-?[\d,\.]+(?:\s*(?:cr|dr))?)'
        - '(?i)amount\s+due[\s\S]{0,100}?(?:rs\.?|inr|₹)\s*(-?[\d,\.]+(?:\s*(?:cr|dr))?)'
        - '(?i)(?:rs\.?|inr|₹)\s*(-?[\d,\.]+(?:\s*(?:cr|dr))?)'
      due_date:
        - '(?i)(?:payment\s+due\s+date|due\s+date|payment\s+due).{0,120}?(\b\d{1,2}[-/\.]\d{1,2}[-/\.]\d{2,4}\b|\b\d{1,2}[-\s](?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*[-\s]\d{2,4}\b|\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s\d{1,2},?\s\d{2,4}\b)'

