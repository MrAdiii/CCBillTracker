# Global settings for the Google Sheets layout and formatting
sheet_schema:
  - id: date
    header: "Date"
    type: date
  - id: biller_name
    header: "Biller Name"
    type: string
  - id: bill_type
    header: "Bill Type"
    type: string
  - id: bill_identifier
    header: "Bill Identifier"
    type: string
  - id: amount_due
    header: "Amount Due"
    type: amount
  - id: due_date
    header: "Due Date"
    type: date
  - id: drive_link
    header: "Document Link"
    type: string
  - id: email_link
    header: "Email Link"
    type: string
  - id: status
    header: "Status"
    type: status

# Dynamic pattern used to name the PDF file uploaded to Google Drive
# Available variables: any ID from the sheet_schema, plus {month_year}
# Fallback global pattern if a provider doesn't define one
file_naming_pattern: "{biller_name} {bill_type} Bill {month_year}"

# Global regex exclusions. If any of these are found within 30 chars of an amount match, the match is discarded.
amount_exclude:
  - 'above'
  - 'greater'
  - 'convert'